<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Agents · Lagos Prime Estates</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background-color: #f8f6f4;
      color: #2a2a2a;
      padding: 2rem;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #003153;
      border-left: 8px solid #c97c4d;
      padding-left: 1.4rem;
      margin-bottom: 2rem;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn {
      background-color: #003153;
      color: white;
      text-decoration: none;
      padding: 0.6rem 1.8rem;
      border: 2px solid #003153;
      border-radius: 6px;
      font-weight: 600;
      transition: 0.1s;
      display: inline-block;
    }
    .btn:hover {
      background-color: #0a4065;
    }
    .btn.warning {
      background-color: #b45f2e;
      border-color: #a75828;
    }
    .btn.warning:hover {
      background-color: #9e4f20;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 2px solid #2a405c;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 6px 6px 0 #a75828;
    }
    th {
      background-color: #003153;
      color: white;
      font-weight: 600;
      text-align: left;
      padding: 0.8rem 1rem;
    }
    td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #d9d2c5;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .agent-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c97c4d;
    }
    .actions a, .actions button {
      margin-right: 0.5rem;
      color: #003153;
      font-weight: 600;
      text-decoration: none;
      background: none;
      border: 1px solid #003153;
      border-radius: 4px;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .actions button {
      border-color: #b45f2e;
      color: #b45f2e;
    }
    .actions button:hover {
      background-color: #b45f2e;
      color: white;
    }
    @media (max-width: 768px) {
      .header-bar { flex-direction: column; align-items: stretch; }
      .btn { text-align: center; }
      table { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h2>Manage agents</h2>
      <div>
        <a href="/admin/add-agent" class="btn">+ Add new agent</a>
        <a href="/admin/dashboard" class="btn">← Dashboard</a>
        <a href="/admin/logout" class="btn warning">Logout</a>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>Photo</th><th>Name</th><th>Role</th><th>Experience</th><th>Contact</th><th>Actions</th></tr>
      </thead>
      <tbody id="agents-list">
        <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadAgents() {
      const tbody = document.getElementById('agents-list');
      try {
        const res = await fetch('/api/agents');
        if (!res.ok) throw new Error('Failed to load');
        const agents = await res.json();
        if (agents.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No agents yet. Click "Add new agent" to create one.</td></tr>';
          return;
        }
        tbody.innerHTML = '';
        agents.forEach(a => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img class="agent-img" src="${a.image || 'https://randomuser.me/api/portraits/lego/1.jpg'}" alt="${escapeHtml(a.name)}"></td>
            <td>${escapeHtml(a.name)}</td>
            <td>${escapeHtml(a.role)}</td>
            <td>${escapeHtml(a.experience)}</td>
            <td>
              <a href="tel:${escapeHtml(a.phone)}">${escapeHtml(a.phone)}</a><br>
              <a href="mailto:${escapeHtml(a.email)}">${escapeHtml(a.email)}</a>
            </td>
            <td class="actions">
              <a href="/admin/edit-agent?id=${a.id}">Edit</a>
              <button onclick="deleteAgent('${a.id}')">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="6" style="color:#b85c24; text-align:center;">Error loading agents.</td></tr>';
      }
    }

    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function deleteAgent(id) {
      if (!confirm('Delete this agent?')) return;
      try {
        const res = await fetch('/admin/agents/' + id, { method: 'DELETE' });
        if (res.ok) {
          loadAgents();
        } else {
          alert('Failed to delete');
        }
      } catch (err) {
        alert('Error deleting');
      }
    }

    loadAgents();
  </script>
</body>
</html>
