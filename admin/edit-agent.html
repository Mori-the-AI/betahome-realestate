<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Agent · Lagos Prime Estates</title>
  <style>
    /* Same styles as add-agent.html */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background-color: #f8f6f4;
      color: #2a2a2a;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #003153;
      border-left: 8px solid #c97c4d;
      padding-left: 1.4rem;
      margin-bottom: 2rem;
    }
    .form-card {
      background: white;
      border: 2px solid #2a405c;
      border-radius: 8px;
      box-shadow: 6px 6px 0 #a75828;
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 600;
      color: #1e2f47;
      margin-bottom: 0.3rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #b3bfcf;
      border-radius: 6px;
      background: #f8f6f4;
      font-size: 1rem;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #003153;
    }
    .btn {
      background-color: #003153;
      color: white;
      border: 2px solid #003153;
      border-radius: 6px;
      padding: 0.8rem 2rem;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover {
      background-color: #0a4065;
    }
    .btn.secondary {
      background-color: #c97c4d;
      border-color: #a75828;
      margin-left: 1rem;
    }
    .btn.secondary:hover {
      background-color: #b45f2e;
    }
    .current-img {
      max-width: 150px;
      border: 2px solid #c97c4d;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit agent</h2>
    <div class="form-card" id="editFormContainer">
      <!-- Form will be populated by JavaScript -->
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const agentId = urlParams.get('id');
    if (!agentId) {
      window.location.href = '/admin/agents';
    }

    async function loadAgent() {
      try {
        const res = await fetch('/api/agents/' + agentId);
        if (!res.ok) throw new Error('Agent not found');
        const a = await res.json();

        const container = document.getElementById('editFormContainer');
        container.innerHTML = `
          <form method="POST" action="/admin/agents/${a.id}" enctype="multipart/form-data">
            <div class="form-group">
              <label>Full name *</label>
              <input type="text" name="name" value="${escapeHtml(a.name)}" required>
            </div>
            <div class="form-group">
              <label>Role / Title *</label>
              <input type="text" name="role" value="${escapeHtml(a.role)}" required>
            </div>
            <div class="form-group">
              <label>Experience</label>
              <input type="text" name="experience" value="${escapeHtml(a.experience || '')}">
            </div>
            <div class="form-group">
              <label>Phone number</label>
              <input type="text" name="phone" value="${escapeHtml(a.phone || '')}">
            </div>
            <div class="form-group">
              <label>Email address</label>
              <input type="email" name="email" value="${escapeHtml(a.email || '')}">
            </div>
            <div class="form-group">
              <label>WhatsApp number</label>
              <input type="text" name="whatsapp" value="${escapeHtml(a.whatsapp || '')}">
            </div>
            <div class="form-group">
              <label>Specialties (comma separated)</label>
              <input type="text" name="specialties" value="${a.specialties ? a.specialties.join(', ') : ''}">
            </div>
            ${a.image ? `
              <div class="form-group">
                <label>Current image</label><br>
                <img src="${a.image}" class="current-img" alt="Agent">
              </div>
            ` : ''}
            <div class="form-group">
              <label>Replace image (leave empty to keep current)</label>
              <input type="file" name="image" accept="image/*">
            </div>
            <div>
              <button type="submit" class="btn">Update agent</button>
              <a href="/admin/agents" class="btn secondary">Cancel</a>
            </div>
          </form>
        `;
      } catch (err) {
        console.error(err);
        document.body.innerHTML = '<h2>Agent not found</h2><a href="/admin/agents">Back to agents</a>';
      }
    }

    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadAgent();
  </script>
</body>
</html>
