<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password · Lagos Prime Estates</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background-color: #f8f6f4;
      color: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: #ffffff;
      border: 2px solid #2a405c;
      border-radius: 8px;
      box-shadow: 6px 6px 0 #a75828;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 450px;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      color: #003153;
      margin-bottom: 1.5rem;
      border-left: 6px solid #c97c4d;
      padding-left: 1rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 600;
      color: #1e2f47;
      margin-bottom: 0.3rem;
    }
    input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #b3bfcf;
      border-radius: 6px;
      background: #f8f6f4;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #003153;
    }
    .btn {
      background-color: #003153;
      color: white;
      border: 2px solid #003153;
      border-radius: 6px;
      padding: 0.8rem 1.5rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: 0.1s;
    }
    .btn:hover {
      background-color: #0a4065;
    }
    .btn.secondary {
      background-color: #c97c4d;
      border-color: #a75828;
      margin-top: 1rem;
    }
    .btn.secondary:hover {
      background-color: #b45f2e;
    }
    .alert {
      background-color: #f8d7da;
      border: 1px solid #f5c2c7;
      color: #842029;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }
    .alert.success {
      background-color: #d1e7dd;
      border-color: #badbcc;
      color: #0f5132;
    }

    /* Mobile responsive */
@media (max-width: 480px) {
  .box {
    padding: 1.5rem;
    max-width: 90%;
  }
  h2 {
    font-size: 1.5rem;
  }
  input {
    padding: 0.6rem;
  }
  .btn {
    padding: 0.6rem;
  }
}
  </style>
</head>
<body>
  <div class="box">
    <h2>Set new password</h2>
    
    <div id="message" class="alert" style="display: none;"></div>

    <form method="POST" action="/admin/reset-password">
      <div class="form-group">
        <label>New password</label>
        <input type="password" name="new_password" required>
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn">Reset password</button>
      <a href="/admin/login" class="btn secondary">Back to login</a>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const messageDiv = document.getElementById('message');
    if (urlParams.get('error') === 'mismatch') {
      messageDiv.textContent = 'Passwords do not match.';
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
